name: CI

permissions:
  contents: write

on:
  push:
    branches: [master, main, slim/cpp-only-vs]
  pull_request:
    branches: [master, main, slim/cpp-only-vs]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # 固定 windows-2022：工程使用 VS2022/v143 工具集与 CMake 的 VS17 生成器。
    # windows-latest 已是 VS2026（CMake 生成器 "Visual Studio 18 2026"）；
    # 需要时用 -VsGenerator 或 OP_VS_GENERATOR 覆盖 bootstrap-deps.ps1 的自动检测。
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: Win32
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache third-party dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            C:\vcpkg\installed
          key: op-deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/bootstrap-deps.ps1', 'vs/op.deps.props') }}
          restore-keys: |
            op-deps-${{ runner.os }}-${{ matrix.arch }}-

      - name: Toolchain info
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -latest -products * -property installationVersion
          } else {
            Write-Host "vswhere not found: $vswhere"
          }

      - name: Bootstrap dependencies (${{ matrix.arch }})
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          $log = "build/bootstrap-${{ matrix.arch }}.log"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          pwsh -NoProfile -File scripts/bootstrap-deps.ps1 -Arch ${{ matrix.arch }} -VcpkgRoot $vcpkg -VsGenerator "Visual Studio 17 2022" 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "===== bootstrap log tail ====="
            Get-Content $log -Tail 120
            exit $code
          }

      - name: Publish bootstrap log tail on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = "build/bootstrap-${{ matrix.arch }}.log"
          if (-not (Test-Path $log)) { exit 0 }
          $all = Get-Content $log
          $lines = @("### CI bootstrap failed (${{ matrix.arch }})", "", "#### head (40)", "")
          $lines += $all | Select-Object -First 40
          $lines += @("", "#### key lines", "")
          $keys = $all | Select-String -Pattern "cache:|清理旧构建|compiler identification|CMake generator|CMAKE_AR|CMAKE_STATIC|OpenCV .*静态库|PATH     :" |
              Select-Object -First 40
          $lines += $keys | ForEach-Object { $_.Line }
          $lines += @("", "#### tail (120)", "")
          $lines += $all | Select-Object -Last 120
          $body = $lines -join [Environment]::NewLine
          $payload = @{ body = $body } | ConvertTo-Json -Depth 3
          $payload | Out-File -Encoding utf8 payload.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json
      - name: Build Release ${{ matrix.platform }}
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/build.ps1
          -Configuration Release -Platform ${{ matrix.platform }}
          -NoTrackFileAccess

      - name: Core tests ${{ matrix.platform }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test.ps1 -Platform ${{ matrix.platform }}

      - name: Synthetic benchmark (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bench.ps1 -Platform x64 -OutFile build/bench-ci.log

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version header and key docs exist
        shell: bash
        run: |
          set -euo pipefail
          test -f include/op_version.h
          grep -q 'OP_VERSION_STRING "' include/op_version.h
          test -f README.md
          test -f doc/cpp-only/API_CHANGES.md
          echo "docs check ok"
